# solved.ac 는 브라우저에서 바로 불러올 수 없어서, 하루 한 번 여기서 받아와 data/solvedac.json 에 저장
# solved.ac v4 API 키: 저장소 Settings → Secrets and variables → Actions 에
#   SOLVEDAC_CLIENT_ID, SOLVEDAC_CLIENT_SECRET 두 개를 넣어 두면 됨 (없으면 solved.ac 는 건너뜀)
name: Update hobby stats

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 한국시간 새벽 3시
  workflow_dispatch:        # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (compatible; homepage-stats-updater)"
    steps:
      - uses: actions/checkout@v4

      - name: solved.ac (v4 API)
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.SOLVEDAC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SOLVEDAC_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::notice::SOLVEDAC_CLIENT_ID / SOLVEDAC_CLIENT_SECRET 이 없어서 solved.ac 는 건너뜀"
            exit 0
          fi
          curl -sf -A "$UA" -H "x-client-id: $CLIENT_ID" -H "x-client-secret: $CLIENT_SECRET" \
            "https://solved.ac/api/v4/users/baek1004" \
          | jq '{handle, tier, rating, solvedCount, class, maxStreak}' > /tmp/solved.json
          mv /tmp/solved.json data/solvedac.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update hobby stats"
            git push
          fi
